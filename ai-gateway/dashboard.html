<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docker Security Simulation Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .alert-card { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .risk-bar-fill { transition: width 0.6s ease; }
    details > summary { list-style: none; cursor: pointer; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-screen-xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl select-none">🛡️</span>
        <div>
          <h1 class="text-lg font-bold text-gray-900 leading-tight">Docker Security Simulation Lab</h1>
          <p class="text-xs text-gray-400">Falco · AI-Powered Threat Analysis · gpt-4o</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="conn-dot" class="w-2 h-2 rounded-full bg-gray-300"></span>
        <span id="conn-text" class="text-gray-400">Connecting…</span>
      </div>
    </div>
  </header>

  <!-- Body -->
  <div class="max-w-screen-xl mx-auto px-6 py-6 flex gap-6 items-start">

    <!-- ── Left sidebar ─────────────────────────────────────────── -->
    <aside class="w-72 flex-shrink-0 space-y-5">

      <!-- Attack Scenarios -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
          <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Attack Scenarios</h2>
        </div>
        <div class="divide-y divide-gray-100" id="attack-list"></div>
      </div>

      <!-- System Health -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-100 bg-gray-50">
          <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">System Health</h2>
        </div>
        <div class="p-4 space-y-2" id="health-list">
          <p class="text-xs text-gray-400">Checking…</p>
        </div>
      </div>

    </aside>

    <!-- ── Live Alert Feed ──────────────────────────────────────── -->
    <main class="flex-1 min-w-0">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between bg-gray-50">
          <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Live Alert Feed</h2>
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400" id="alert-count">0 alerts</span>
            <span class="flex items-center gap-1.5 text-xs text-gray-400">
              <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse" id="live-dot"></span>
              Live
            </span>
          </div>
        </div>

        <div id="alert-feed" style="max-height: calc(100vh - 180px); overflow-y: auto;">
          <div id="empty-state" class="py-16 text-center">
            <div class="text-4xl mb-3 select-none">📡</div>
            <p class="text-sm text-gray-400">No alerts yet.</p>
            <p class="text-xs text-gray-300 mt-1">Trigger an attack to see AI analysis appear here in real time.</p>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    // ── Helpers ─────────────────────────────────────────────────────────────
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = String(str ?? "");
      return d.innerHTML;
    }

    function t(el, text) { el.textContent = String(text ?? ""); }

    // ── Scenario metadata ───────────────────────────────────────────────────
    const SCENARIOS = [
      { id: "escape",  name: "Container Escape",      cve: "CVE-2024-21626", desc: "runc /proc/self/fd directory traversal",     tag: "T1611", tagCls: "bg-red-50 text-red-600",    icon: "🚪" },
      { id: "sock",    name: "Docker Socket Abuse",   cve: null,              desc: "Spawn privileged containers via docker.sock", tag: "T1610", tagCls: "bg-orange-50 text-orange-600", icon: "🔌" },
      { id: "lateral", name: "Lateral Movement",      cve: null,              desc: "nsenter + east-west network scanning",        tag: "T1046", tagCls: "bg-yellow-50 text-yellow-700", icon: "↔️" },
      { id: "secrets", name: "Secrets Exfiltration",  cve: null,              desc: "Read /etc/shadow and process env vars",       tag: "T1552", tagCls: "bg-purple-50 text-purple-600", icon: "🔑" },
      { id: "authz",   name: "AuthZ Bypass",          cve: "CVE-2026-34040", desc: "Oversized body bypasses plugin inspection",   tag: "T1610", tagCls: "bg-orange-50 text-orange-600", icon: "🔓" },
    ];

    const SEV = {
      CRITICAL: { badge: "bg-red-100 text-red-700 border border-red-200",         bar: "bg-red-400",    lbl: "text-red-700"    },
      HIGH:     { badge: "bg-orange-100 text-orange-700 border border-orange-200", bar: "bg-orange-400", lbl: "text-orange-700" },
      MEDIUM:   { badge: "bg-yellow-100 text-yellow-700 border border-yellow-200", bar: "bg-yellow-400", lbl: "text-yellow-700" },
      LOW:      { badge: "bg-green-100 text-green-700 border border-green-200",    bar: "bg-green-400",  lbl: "text-green-700"  },
    };

    // ── Render sidebar attack cards (static content — no user data) ─────────
    function renderAttacks() {
      const list = document.getElementById("attack-list");
      SCENARIOS.forEach(s => {
        const wrap = document.createElement("div");
        wrap.className = "px-4 py-3";

        // Top row
        const topRow = document.createElement("div");
        topRow.className = "flex items-start gap-2 mb-2";

        const iconEl = document.createElement("span");
        iconEl.className = "text-lg select-none mt-0.5";
        iconEl.textContent = s.icon;

        const textWrap = document.createElement("div");
        const nameEl = document.createElement("p");
        nameEl.className = "text-sm font-medium text-gray-800";
        nameEl.textContent = s.name;
        const descEl = document.createElement("p");
        descEl.className = "text-xs text-gray-400 leading-snug";
        descEl.textContent = s.desc;
        textWrap.append(nameEl, descEl);
        topRow.append(iconEl, textWrap);

        // Bottom row: tag, cve, button
        const botRow = document.createElement("div");
        botRow.className = "flex items-center gap-2 mt-2";

        const tagEl = document.createElement("span");
        tagEl.className = `text-xs px-1.5 py-0.5 rounded font-mono ${s.tagCls}`;
        tagEl.textContent = s.tag;

        botRow.appendChild(tagEl);

        if (s.cve) {
          const cveEl = document.createElement("span");
          cveEl.className = "text-xs text-gray-400";
          cveEl.textContent = s.cve;
          botRow.appendChild(cveEl);
        }

        const btn = document.createElement("button");
        btn.className = "ml-auto text-xs px-3 py-1.5 rounded-md bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition-colors disabled:opacity-50";
        btn.textContent = "Trigger";
        btn.addEventListener("click", () => triggerAttack(s.id, btn));
        botRow.appendChild(btn);

        wrap.append(topRow, botRow);
        list.appendChild(wrap);
      });
    }

    // ── Trigger an attack via the gateway proxy ─────────────────────────────
    async function triggerAttack(scenario, btn) {
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        const r = await fetch(`/api/trigger/${encodeURIComponent(scenario)}`, { method: "POST" });
        const data = await r.json();
        btn.textContent = data.status === "attacking" ? "Fired ✓" : "Done";
      } catch {
        btn.textContent = "Error";
      }
      setTimeout(() => { btn.disabled = false; btn.textContent = "Trigger"; }, 3000);
    }

    // ── Health check ────────────────────────────────────────────────────────
    async function checkHealth() {
      const list = document.getElementById("health-list");
      try {
        const r = await fetch("/api/health");
        const data = await r.json();
        list.textContent = "";
        Object.entries(data).forEach(([name, info]) => {
          const ok = info.status === "ok" || info.status === "attacking";
          const row = document.createElement("div");
          row.className = "flex items-center justify-between";

          const lbl = document.createElement("span");
          lbl.className = "text-sm text-gray-600 capitalize";
          lbl.textContent = name;

          const right = document.createElement("div");
          right.className = "flex items-center gap-1.5";

          const dot = document.createElement("span");
          dot.className = `w-2 h-2 rounded-full ${ok ? "bg-green-400" : "bg-red-400"}`;

          const status = document.createElement("span");
          status.className = `text-xs ${ok ? "text-green-600" : "text-red-500"}`;
          status.textContent = ok ? "Ready" : String(info.status);

          right.append(dot, status);
          row.append(lbl, right);
          list.appendChild(row);
        });
      } catch {
        list.textContent = "";
        const err = document.createElement("p");
        err.className = "text-xs text-red-400";
        err.textContent = "Health check failed";
        list.appendChild(err);
      }
    }

    // ── Alert card renderer ─────────────────────────────────────────────────
    let alertCount = 0;

    function addField(parent, label, value) {
      if (!value && value !== 0) return;
      const row = document.createElement("div");
      row.className = "flex items-start gap-2";
      const lbl = document.createElement("span");
      lbl.className = "text-xs font-semibold text-gray-400 w-28 flex-shrink-0 pt-0.5";
      lbl.textContent = label;
      const val = document.createElement("p");
      val.className = "text-xs text-gray-700 leading-relaxed";
      val.textContent = String(value);
      row.append(lbl, val);
      parent.appendChild(row);
    }

    function renderAlert(alert) {
      const feed = document.getElementById("alert-feed");
      const empty = document.getElementById("empty-state");
      if (empty) empty.remove();

      alertCount++;
      document.getElementById("alert-count").textContent = `${alertCount} alert${alertCount !== 1 ? "s" : ""}`;

      const sev = alert.severity || "CRITICAL";
      const style = SEV[sev] || SEV.CRITICAL;
      const a = alert.analysis || {};
      const risk = parseInt(a.risk_score ?? 0, 10);
      const ts = alert.timestamp ? new Date(alert.timestamp).toLocaleTimeString() : "";

      // Card container
      const card = document.createElement("div");
      card.className = "alert-card px-5 py-4 hover:bg-gray-50 transition-colors border-b border-gray-100";

      // Top row: severity badge + rule + scenario + timestamp
      const topRow = document.createElement("div");
      topRow.className = "flex items-start justify-between gap-4 mb-2";

      const left = document.createElement("div");
      left.className = "flex items-center gap-2 flex-wrap";

      const badge = document.createElement("span");
      badge.className = `text-xs font-semibold px-2 py-0.5 rounded-full ${style.badge}`;
      badge.textContent = sev;

      const ruleName = document.createElement("span");
      ruleName.className = "text-sm font-medium text-gray-800";
      ruleName.textContent = alert.rule || "Unknown Rule";

      const scenarioBadge = document.createElement("span");
      scenarioBadge.className = "text-xs text-gray-400 bg-gray-100 px-2 py-0.5 rounded";
      scenarioBadge.textContent = alert.scenario || "";

      left.append(badge, ruleName, scenarioBadge);

      const tsEl = document.createElement("span");
      tsEl.className = "text-xs text-gray-400 flex-shrink-0";
      tsEl.textContent = ts;

      topRow.append(left, tsEl);

      // Triage text
      const triageEl = document.createElement("p");
      triageEl.className = "text-xs text-gray-600 mb-3 leading-relaxed";
      triageEl.textContent = alert.triage || "";

      // Expandable analysis
      const details = document.createElement("details");
      details.className = "group";

      const summary = document.createElement("summary");
      summary.className = "flex items-center gap-1 text-xs text-indigo-600 hover:text-indigo-700 font-medium select-none";
      summary.innerHTML =
        '<svg class="w-3.5 h-3.5 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
        '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>' +
        'View AI Analysis';

      const body = document.createElement("div");
      body.className = "mt-3 space-y-3 pl-1";

      addField(body, "MITRE", a.mitre_technique);
      addField(body, "What happened", a.what_happened);
      addField(body, "Misconfiguration", a.misconfiguration);

      // Risk bar
      if (a.risk_score !== undefined) {
        const riskRow = document.createElement("div");
        riskRow.className = "flex items-start gap-2";
        const riskLbl = document.createElement("span");
        riskLbl.className = "text-xs font-semibold text-gray-400 w-28 flex-shrink-0 pt-0.5";
        riskLbl.textContent = "Risk score";
        const barWrap = document.createElement("div");
        barWrap.className = "flex items-center gap-2 flex-1";
        const track = document.createElement("div");
        track.className = "flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden";
        const fill = document.createElement("div");
        fill.className = `h-full ${style.bar} risk-bar-fill rounded-full`;
        fill.style.width = `${risk * 10}%`;
        track.appendChild(fill);
        const score = document.createElement("span");
        score.className = `text-xs font-bold ${style.lbl}`;
        score.textContent = `${risk}/10`;
        barWrap.append(track, score);
        riskRow.append(riskLbl, barWrap);
        body.appendChild(riskRow);
      }

      addField(body, "Next move", a.predicted_next_move);

      // Hardened config code block
      if (a.hardened_config) {
        const cfgRow = document.createElement("div");
        cfgRow.className = "flex items-start gap-2";
        const cfgLbl = document.createElement("span");
        cfgLbl.className = "text-xs font-semibold text-gray-400 w-28 flex-shrink-0 pt-1";
        cfgLbl.textContent = "Hardened config";
        const pre = document.createElement("pre");
        pre.className = "text-xs text-gray-700 bg-gray-50 border border-gray-200 rounded-md p-2 flex-1 font-mono leading-relaxed overflow-auto whitespace-pre-wrap break-words";
        pre.textContent = String(a.hardened_config);
        cfgRow.append(cfgLbl, pre);
        body.appendChild(cfgRow);
      }

      // Fallback for unexpected JSON shape
      if (!a.mitre_technique && !a.what_happened && a.raw !== undefined) {
        const pre = document.createElement("pre");
        pre.className = "text-xs text-gray-600 bg-gray-50 rounded p-2 whitespace-pre-wrap break-words";
        pre.textContent = String(a.raw || "");
        body.appendChild(pre);
      }

      details.append(summary, body);
      card.append(topRow, triageEl, details);
      feed.insertBefore(card, feed.firstChild);

      // Keep max 30 cards
      const cards = feed.querySelectorAll(".alert-card");
      if (cards.length > 30) cards[cards.length - 1].remove();
    }

    // ── SSE connection ──────────────────────────────────────────────────────
    function connectSSE() {
      const dot = document.getElementById("conn-dot");
      const text = document.getElementById("conn-text");
      const liveDot = document.getElementById("live-dot");

      const es = new EventSource("/stream");

      es.onopen = () => {
        dot.className = "w-2 h-2 rounded-full bg-green-400";
        t(text, "Connected");
        text.className = "text-green-600 text-sm";
        liveDot.className = "w-2 h-2 rounded-full bg-green-400 animate-pulse";
      };

      es.onmessage = (e) => {
        try { renderAlert(JSON.parse(e.data)); } catch {}
      };

      es.onerror = () => {
        dot.className = "w-2 h-2 rounded-full bg-red-400";
        t(text, "Reconnecting…");
        text.className = "text-red-500 text-sm";
        liveDot.className = "w-2 h-2 rounded-full bg-gray-300";
        es.close();
        setTimeout(connectSSE, 5000);
      };
    }

    // ── Load existing alerts on page open ───────────────────────────────────
    async function loadRecentAlerts() {
      try {
        const r = await fetch("/api/alerts");
        const alerts = await r.json();
        alerts.slice().reverse().forEach(renderAlert);
      } catch {}
    }

    // ── Boot ────────────────────────────────────────────────────────────────
    renderAttacks();
    loadRecentAlerts();
    checkHealth();
    setInterval(checkHealth, 8000);
    connectSSE();
  </script>
</body>
</html>
