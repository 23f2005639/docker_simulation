- rule: Docker Socket Access from Container
  desc: curl used inside a container to enumerate the Docker Engine API via docker.sock — common first step in socket abuse attacks
  condition: >
    spawned_process and container and
    proc.name = "curl" and
    proc.cmdline contains "docker.sock"
  output: >
    Docker socket access via curl from container — possible host takeover
    (user=%user.name container=%container.name image=%container.image.repository
     proc=%proc.cmdline scenario=docker-socket-abuse)
  priority: CRITICAL
  tags: [container, docker_sock, mitre_t1610]

- rule: New Privileged Container Created via Socket
  desc: Docker CLI used from inside container to spawn another privileged container
  condition: >
    container and
    proc.name in (docker, dockerd) and
    proc.cmdline contains "--privileged"
  output: >
    Privileged sibling container spawned via Docker API
    (user=%user.name container=%container.name cmd=%proc.cmdline scenario=docker-socket-abuse)
  priority: CRITICAL
  tags: [container, docker_sock, mitre_t1610]
